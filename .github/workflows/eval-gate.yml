# Eval gate (issue #42; spec v1.1 §3 item 1).
#
# Runs the CI slice of the golden set (evals/thresholds.toml) against the real
# model on pull requests that can change extraction quality, then judges the
# result against the preregistered thresholds with check_gate.py.
#
# Real Groq calls: needs the GROQ_API_KEY repository secret. Fork PRs never get
# secrets, so for them the gate is skipped with a warning; on a same-repo PR a
# missing secret fails the job, so a misconfiguration can't pass as green.

name: Eval gate

on:
  pull_request:
    paths:
      - "backend/plugins/**"
      - "backend/agents/**"
      - "backend/core/llm.py"
      - "backend/core/pipeline.py"
      - "backend/core/config.py"
      - "backend/tests/evaluation/**"
      - "evals/thresholds.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/eval-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One gate run per branch: a newer push cancels the older run's API calls.
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval-gate:
    name: Eval gate (CI slice, real model)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # backend/core/llm.py syncs the ADR 006 token budget from every
      # response's rate-limit headers, which needs Redis.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LLM_PROVIDER: groq
      REDIS_URL: redis://localhost:6379/0
      # Required by Settings at import; the eval never touches the database.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      CONFIDENCE_THRESHOLD: "0.75"
      MAX_UPLOAD_SIZE_MB: "10"
      ENVIRONMENT: test
      WEBHOOK_TIMEOUT_SECONDS: "10"
      IS_FORK: ${{ github.event.pull_request.head.repo.fork || false }}
    steps:
      - name: Check the API key is available
        id: key
        run: |
          if [ -n "$GROQ_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "$IS_FORK" = "true" ]; then
            echo "::warning::Fork PR: no secrets, eval gate skipped."
            echo "## Eval gate: skipped (fork PR, no secrets)" >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::GROQ_API_KEY repository secret is not set (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'

      - uses: astral-sh/setup-uv@v7
        if: steps.key.outputs.present == 'true'
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        if: steps.key.outputs.present == 'true'
        run: uv sync --locked --extra dev

      - name: Run the CI slice
        if: steps.key.outputs.present == 'true'
        run: >-
          uv run python -m backend.tests.evaluation.run_eval
          --slice ci --model openai/gpt-oss-20b --output-dir eval-gate-results

      - name: Judge against the preregistered thresholds
        if: steps.key.outputs.present == 'true'
        run: uv run python -m backend.tests.evaluation.check_gate eval-gate-results/*-ci.json

      - name: Upload the result file
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-gate-results
          path: eval-gate-results/
          if-no-files-found: ignore
