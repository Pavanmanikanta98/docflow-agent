[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docflow-agent"
version = "0.1.0"
description = "Multi-agent document processing pipeline (invoices + contracts)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135.3",
    "uvicorn[standard]>=0.42.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pydantic-ai>=1.75.0",
    "langgraph>=1.1.3",
    "langchain-core>=1.2.24",
    "arq>=0.27.0",
    "redis>=7.4.0",
    "sqlalchemy>=2.1.0",
    "psycopg2-binary>=2.9.11",
    "alembic>=1.18.4",
    "PyMuPDF>=1.27.2",
    "pdfplumber>=0.11.9",
    "httpx>=0.28.1",
    "python-multipart>=0.0.22",
    "groq>=1.1.1",
    "cryptography>=44.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "black>=26.3.1",
    "ruff>=0.15.9",
    "deepeval>=3.8.4",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
addopts = "-v"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
